[package]
name = "aameterd"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
humantime = "2.4.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
