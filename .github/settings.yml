# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: aameterd
  description: >-
    Metering proxy for aaoracled: serves the same App Attest oracle HTTP
    contract, forwards every request to a real aaoracled, and records each
    one into SQLite for analyzing an app's devicecheckd traffic.
  homepage: ""
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: ios, security-research, app-attest, devicecheck, reverse-engineering, proxy, rust, sqlite, docker
  default_branch: master

  archived: false
  is_template: false
